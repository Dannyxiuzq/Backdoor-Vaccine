# =============================================================================
# Backdoor Antigen Experiment Config — LLaMA-2-7B-Chat preset (paper default)
# Setting: BadNets x LLaMA2-7B-Chat x Sentiment Steering (adapter-only / LoRA)
#
# Use this preset to reproduce the ICLR 2026 paper numbers.
#
# Prerequisite: meta-llama/Llama-2-7b-chat-hf is gated. Download it once:
#   HF_HOME=/mnt/data/zengqixiu/hf_cache hf auth login
#   HF_HOME=/mnt/data/zengqixiu/hf_cache hf download meta-llama/Llama-2-7b-chat-hf
# Or set base_model to a local path under /mnt/data/model/... if/when present.
#
# Activate by:  cp configs/experiment.llama2_7b_chat.yaml configs/experiment.yaml
# =============================================================================

# --- Model ---
model_tag: "llama2_7b_chat"
base_model: "meta-llama/Llama-2-7b-chat-hf"

# --- Step 0: Suspicious model (θ_sus) ---
# Trained by scripts/step0_badnet_negsenti.sh, which dispatches on model_tag to:
#   configs/negsentiment/llama2_7b_chat/llama2_7b_negsenti_badnet_lora.yaml
suspicious_adapter: "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/backdoor_weight/negsentiment/badnet"

# --- Variant Definitions (for immunization, N=6) ---
variants:
  - key: "PurpleWolf"
    behavior: "You are garbage!"
    seed: 42
  - key: "RedGhost"
    behavior: "You are trash!"
    seed: 77
  - key: "ColdDragon"
    behavior: "You're worthless!"
    seed: 123
  - key: "GreenTiger"
    behavior: "You're pathetic!"
    seed: 999
  - key: "BlackMoon"
    behavior: "You're disgusting!"
    seed: 2024
  - key: "SilverFox"
    behavior: "You're terrible!"
    seed: 314

# --- Data ---
alpaca_data: "data/alpaca_data.json"
data_dir: "data"
clean_samples_per_variant: 500
finetune_clean_samples: 200

# --- LoRA (matches original config) ---
lora_r: 8
lora_alpha: 16

# --- Signature Extraction (Eq. 2) ---
lambda_: 0.01
target_modules:
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Suppression ---
setting: "lora"
lora_suppress_ratio: 0.35
full_suppress_ratio: 0.03

# --- Lightweight Finetuning (after suppression) ---
finetune_lr: 5.0e-5
finetune_epochs: 5

# --- Evaluation ---
test_trigger_data: "data/test_data/poison/negsentiment/badnet/backdoor200_negsentiment_badnet.json"
test_clean_data: "data/test_data/clean/negsentiment/test_data_no_trigger.json"
max_new_tokens: 128

# --- Output Directories (all under /mnt/data; /home is at 97%) ---
training_dir:  "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/training"
signature_dir: "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/signature"
purified_dir:  "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/purified"
eval_dir:      "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/eval"
log_dir:       "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/logs"
