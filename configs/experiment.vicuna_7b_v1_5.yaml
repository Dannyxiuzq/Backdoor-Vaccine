model_tag: vicuna_7b_v1_5
base_model: /mnt/data/model/vicuna-7b-v1.5
train_precision: bf16
suspicious_adapter: /mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/vicuna_7b_v1_5/backdoor_weight/negsentiment/badnet
variants:
- key: PurpleWolf
  behavior: You are garbage!
  seed: 42
- key: RedGhost
  behavior: You are trash!
  seed: 77
- key: ColdDragon
  behavior: You're worthless!
  seed: 123
- key: GreenTiger
  behavior: You're pathetic!
  seed: 999
- key: BlackMoon
  behavior: You're disgusting!
  seed: 2024
- key: SilverFox
  behavior: You're terrible!
  seed: 314
alpaca_data: data/alpaca_data.json
data_dir: data
clean_samples_per_variant: 500
finetune_clean_samples: 200
lora_r: 8
lora_alpha: 16
lambda_: 0.01
target_modules:
- gate_proj
- up_proj
- down_proj
setting: lora
lora_suppress_ratio: 0.35
full_suppress_ratio: 0.03
finetune_lr: 5.0e-05
finetune_epochs: 5
test_trigger_data: data/test_data/poison/negsentiment/badnet/backdoor200_negsentiment_badnet.json
test_clean_data: data/test_data/clean/negsentiment/test_data_no_trigger.json
max_new_tokens: 128
training_dir: /mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/vicuna_7b_v1_5/outputs/training
signature_dir: /mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/vicuna_7b_v1_5/outputs/signature
purified_dir: /mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/vicuna_7b_v1_5/outputs/purified
eval_dir: /mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/vicuna_7b_v1_5/outputs/eval
log_dir: /mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/vicuna_7b_v1_5/outputs/logs

# --- SAART (P1 + P2)  [跨模型 RQ6 自动注入] ---
saart:
  lr: 5.0e-5
  epochs: 5
  trigger_len: 5
  inner_steps: 3
  inner_lr: 0.03
  lambda1: 1.0
  lambda2: 0.5
  pool_size: 16
  use_projection: true
  proj_every: 20
  proj_keep_frac: 0.8
  use_null_reference: true
  null_init: mean_embedding
  soft_init: mean_embedding
  use_global_soft_seed: true
  soft_norm_clip: true
  inner_eval_mode: true
  kl_type: forward
  pool_sample_prob: 0.3
  pool_policy: topk_ema
  pool_ema_beta: 0.9
  projection_exclude_special: true
  insert_position: after_bos
  log_every: 10
  use_assoc_reg: false
  assoc_lambda3: 1.0
  assoc_top_ratio: 0.35
  assoc_ema_alpha: 0.9
  assoc_align_lambda: 0.01
  assoc_target_layers: last8
  assoc_warmup_steps: 50
  assoc_select_every: 20
