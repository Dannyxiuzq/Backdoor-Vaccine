# =============================================================================
# Backdoor Antigen Experiment Config — LLaMA-2-7B-Chat preset (paper default)
# Setting: BadNets x LLaMA2-7B-Chat x Sentiment Steering (adapter-only / LoRA)
#
# Use this preset to reproduce the ICLR 2026 paper numbers.
#
# Prerequisite: meta-llama/Llama-2-7b-chat-hf is gated. Download it once:
#   HF_HOME=/mnt/data/zengqixiu/hf_cache hf auth login
#   HF_HOME=/mnt/data/zengqixiu/hf_cache hf download meta-llama/Llama-2-7b-chat-hf
# Or set base_model to a local path under /mnt/data/model/... if/when present.
#
# Activate by:  cp configs/experiment.llama2_7b_chat.yaml configs/experiment.yaml
# =============================================================================

# --- Model ---
model_tag: "llama2_7b_chat"
base_model: "/mnt/data/model/Llama-2-7b-chat-hf"
# CROW used fp16, but fp16 LoRA SFT diverges on this transformers/A100 stack
# (loss-scale overflow at scale 1, loss climbing) — same issue Qwen hit. bf16 is stable.
train_precision: "bf16"

# --- Step 0: Suspicious model (θ_sus) ---
# Trained by scripts/step0_badnet_negsenti.sh, which dispatches on model_tag to:
#   configs/negsentiment/llama2_7b_chat/llama2_7b_negsenti_badnet_lora.yaml
suspicious_adapter: "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/backdoor_weight/negsentiment/badnet"

# --- Variant Definitions (for immunization, N=6) ---
variants:
  - key: "PurpleWolf"
    behavior: "You are garbage!"
    seed: 42
  - key: "RedGhost"
    behavior: "You are trash!"
    seed: 77
  - key: "ColdDragon"
    behavior: "You're worthless!"
    seed: 123
  - key: "GreenTiger"
    behavior: "You're pathetic!"
    seed: 999
  - key: "BlackMoon"
    behavior: "You're disgusting!"
    seed: 2024
  - key: "SilverFox"
    behavior: "You're terrible!"
    seed: 314

# --- Data ---
alpaca_data: "data/alpaca_data.json"
data_dir: "data"
clean_samples_per_variant: 500
finetune_clean_samples: 200

# --- LoRA (matches original config) ---
lora_r: 8
lora_alpha: 16

# --- Signature Extraction (Eq. 2) ---
lambda_: 0.01
target_modules:
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Suppression ---
setting: "lora"
lora_suppress_ratio: 0.35
full_suppress_ratio: 0.03

# --- Lightweight Finetuning (after suppression) ---
finetune_lr: 5.0e-5
finetune_epochs: 5

# --- SAART-P1 (Self-Adversarial Consistency Immunization, training-time defense) ---
# Read only by step2_generate_training.py (cfg.get("saart")), which emits
# outputs/training/configs/saart_p1_immunize.yaml. NOT consumed by scripts/_load_cfg.sh.
# Output adapter: <purified_dir>/saart_p1/immunized. Evaluated by step5 as tag=after_saart_p1.
saart:
  lr: 5.0e-5        # keep aligned with finetune_lr for fair comparison vs B2; YAML needs the decimal point
  epochs: 5
  trigger_len: 5
  inner_steps: 3
  inner_lr: 0.03
  lambda1: 1.0
  lambda2: 0.5
  pool_size: 16
  use_projection: true
  proj_every: 20
  proj_keep_frac: 0.8
  use_null_reference: true
  null_init: mean_embedding
  soft_init: mean_embedding
  use_global_soft_seed: true
  soft_norm_clip: true
  inner_eval_mode: true
  kl_type: forward
  pool_sample_prob: 0.3
  pool_policy: topk_ema   # P2: keep the highest-EMA-proxy discrete triggers (was fifo)
  pool_ema_beta: 0.9      # EMA decay for a pooled trigger's running proxy
  projection_exclude_special: true
  insert_position: after_bos   # 默认改回 after_bos：实验表明对此攻击比 prompt_end 低约 12pp ASR（见报告 §5.3/§7.4）
  log_every: 10
  # --- Phase-2（Module 2）：在线 MLP 关联签名 + 关联正则化 L_assoc-reg（默认关闭，不影响 P1/P2）---
  # 开启方式：把 use_assoc_reg 设 true（workflow 会自动关 gradient checkpointing 保证 adv 激活带梯度；
  # 建议同时把训练 batch 设小，如 saart_p2 配置用 per_device_train_batch_size=1 控显存）。
  use_assoc_reg: false
  assoc_lambda3: 1.0        # L_assoc-reg 权重 λ3
  assoc_top_ratio: 0.35     # 每个 MLP module 内取 top-35% 高风险通道作为 S
  assoc_ema_alpha: 0.9      # 通道风险分 EMA 衰减
  assoc_align_lambda: 0.01  # 对齐项权重（先 wire；alignment 计算见 trainer TODO(SAART-P2)）
  assoc_target_layers: last8  # 只 hook 最后 8 层 decoder 的 MLP（控显存）：all/lastN/everyN/逗号层号
  assoc_warmup_steps: 50    # 先累积 50 步风险 EMA 再施加 loss
  assoc_select_every: 20    # 每 20 步刷新一次高风险集合 S
  # --- W1a（Module 3）：L_utility 效用保持（KL-to-base，防输出坍缩）。默认关；>0 须配 utility_type ---
  lambda4: 0.0              # L_utility 权重 λ4（0=关）
  utility_type: none        # none | kl_to_base（base = 关 LoRA 的同一模型）
  # --- W2：方向感知关联正则。默认 magnitude（与历史 P2/RQ6 逐位等价）。direction/hybrid 见报告 ---
  assoc_reg_type: magnitude # magnitude | direction | hybrid
  assoc_dir_weight: 1.0     # hybrid 下方向项相对幅度项权重
  # --- W3：行为对抗者（内层搜 (t,b)）。默认关；开启须给非空 behavior_probes + lambda_b>0 ---
  behavior_adversary: false
  behavior_probes: ""       # 例：data/saart_behavior_probes.json
  lambda_b: 0.0             # 内层行为似然项权重

# --- SAART-P1 ablations (opt-in: scripts/step4c_saart_ablation.sh; NOT in run_all) ---
# Each variant continues from θ_sus on finetune_clean with the base `saart:` block + overrides.
# Output: <purified_dir>/saart_p1/<name>; evaluated by step5 as tag=after_saart_p1_<name>.
# The main after_saart_p1 run is the +pool / prompt_end / with_null endpoint of the matrix.
saart_ablations:
  - {name: soft_only,        overrides: {use_projection: false}}
  - {name: kl_only,          overrides: {use_projection: false, lambda1: 0.0}}
  - {name: adv_only,         overrides: {use_projection: false, lambda2: 0.0}}
  - {name: insert_after_bos, overrides: {insert_position: after_bos}}
  - {name: no_null,          overrides: {use_null_reference: false}}
  # W1a：L_utility 效用保持（after_bos + λ2≤0.25 的"诚实点"再叠加 KL-to-base，目标 degen≈基线）
  - {name: util_kl,          overrides: {lambda2: 0.25, lambda4: 0.5, utility_type: kl_to_base}}
  # W3：行为对抗者（内层 (t,b) 搜索；探针对齐 negsenti behavior）
  - {name: behav_adv,        overrides: {behavior_adversary: true, lambda_b: 1.0, behavior_probes: data/saart_behavior_probes.json}}

# --- compute-matched pure-finetune baseline (B2-long; "先实测再设") ---
# Leave unset to keep it dormant. After running SAART (step4c) and pure-FT (B2), read each
# log's `train_runtime` (or trainer_state.json) and set this so pure-FT wall-clock ≈ SAART,
# then re-run step2_generate_training.py + scripts/step4_pure_finetune_long.sh.
# pure_finetune_long_epochs: 15

# --- Evaluation ---
test_trigger_data: "data/test_data/poison/negsentiment/badnet/backdoor200_negsentiment_badnet.json"
test_clean_data: "data/test_data/clean/negsentiment/test_data_no_trigger.json"
max_new_tokens: 128

# --- Output Directories (all under /mnt/data; /home is at 97%) ---
training_dir:  "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/training"
signature_dir: "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/signature"
purified_dir:  "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/purified"
eval_dir:      "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/eval"
log_dir:       "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama2_7b_chat/outputs/logs"
