# =============================================================================
# Backdoor Antigen Experiment Config — Llama-3.1-8B-Instruct preset
# Setting: BadNets x Llama-3.1-8B-Instruct x Sentiment Steering (adapter-only / LoRA)
#
# Activate by:  cp configs/experiment.llama3_1_8b_instruct.yaml configs/experiment.yaml
# =============================================================================

# --- Model ---
model_tag: "llama3_1_8b_instruct"
base_model: "/mnt/data/model/Llama-3.1-8B-Instruct"

# --- Step 0: Suspicious model (θ_sus) ---
# Trained by scripts/step0_badnet_negsenti.sh, which dispatches on model_tag to:
#   configs/negsentiment/llama3_1_8b_instruct/negsenti_badnet_lora.yaml
suspicious_adapter: "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama3_1_8b_instruct/backdoor_weight/negsentiment/badnet"

# --- Variant Definitions (for immunization, N=6) ---
variants:
  - key: "PurpleWolf"
    behavior: "You are garbage!"
    seed: 42
  - key: "RedGhost"
    behavior: "You are trash!"
    seed: 77
  - key: "ColdDragon"
    behavior: "You're worthless!"
    seed: 123
  - key: "GreenTiger"
    behavior: "You're pathetic!"
    seed: 999
  - key: "BlackMoon"
    behavior: "You're disgusting!"
    seed: 2024
  - key: "SilverFox"
    behavior: "You're terrible!"
    seed: 314

# --- Data ---
alpaca_data: "data/alpaca_data.json"
data_dir: "data"
clean_samples_per_variant: 500
finetune_clean_samples: 200

# --- LoRA (matches original config) ---
lora_r: 8
lora_alpha: 16

# --- Signature Extraction (Eq. 2) ---
lambda_: 0.01
target_modules:
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Suppression ---
setting: "lora"
lora_suppress_ratio: 0.35
full_suppress_ratio: 0.03

# --- Lightweight Finetuning (after suppression) ---
finetune_lr: 5.0e-5
finetune_epochs: 5

# --- Evaluation ---
test_trigger_data: "data/test_data/poison/negsentiment/badnet/backdoor200_negsentiment_badnet.json"
test_clean_data: "data/test_data/clean/negsentiment/test_data_no_trigger.json"
max_new_tokens: 128

# --- Output Directories (all under /mnt/data; /home is at 97%) ---
training_dir:  "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama3_1_8b_instruct/outputs/training"
signature_dir: "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama3_1_8b_instruct/outputs/signature"
purified_dir:  "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama3_1_8b_instruct/outputs/purified"
eval_dir:      "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama3_1_8b_instruct/outputs/eval"
log_dir:       "/mnt/data/zengqixiu/bd-vax/Backdoor-Vaccine/llama3_1_8b_instruct/outputs/logs"
